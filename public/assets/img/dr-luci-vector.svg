  <title id="luciTitle">Dr. Luci, mentor of Carbon Code</title>
  <desc id="luciDesc">Flat vector portrait of the artificial magus Dr. Luci: messy black hair, one violet eye and one dark eye marked with an atom symbol, high-collared black coat with purple lining, and an atom brooch.</desc>
